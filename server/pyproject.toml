[project]
# distribution name (PyPI-safe); the import package and CLI stay `tee`
name = "tee-engine"
version = "0.9.0"
description = "Token Efficiency Engine - helps any AI minimize tokens per completed task; protocol discipline plus cloud/local compute routing; MCP server with Unreal Engine and Blender adapters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "interaeronav" }]
dependencies = [
    # bare mcp: the [cli] extra only adds typer + python-dotenv for the
    # SDK's own `mcp` command, which TEE never invokes (tee has its own CLI)
    "mcp>=2.0.0,<3",
]

[project.scripts]
tee = "tee.cli:main"

[project.optional-dependencies]
extract = [
    "ezdxf>=1.4.4",
    "faster-whisper>=1.2.1",
    "ifcopenshell>=0.8.5",
    "imagehash>=4.3.2",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pymap3d>=3.2.0",
    "pypdfium2>=5.13.0",
    "pyproj>=3.7.2",
    "pytesseract>=0.3.13",
    "scenedetect>=0.7.1",
    "shapely>=2.1.2",
]
assets = [
    "astral>=3.2",
    "imagehash>=4.3.2",
    "pillow>=12.3.0",
    "shapely>=2.1.2",
]
physical = [
    "ifctester>=0.8.5",
    "py-slvs>=1.0.6",
]
# A45 P2a: the solver group. All permissive (HiGHS MIT, OR-Tools Apache-2.0,
# PySCIPOpt MIT wrapper over a separately-licensed SCIP build, Cbc EPL-2.0),
# all lazy-imported, none loaded until a solve_* tool is called.
# NOTE ortools and highspy each bundle their own libhighs and the dynamic
# linker binds to whichever loads first - so CP-SAT runs in a subprocess.
# See src/tee/fleet/_cpsat_worker.py; do not "simplify" that away.
solve = [
    "pulp>=3.3.2",
    "highspy>=1.15.1",
    "pyscipopt>=6.2.1",
    "ortools>=9.15,<10",
]
# A45 P2b: portfolio optimisation. PyPortfolioOpt MIT, skfolio BSD-3-Clause.
# `packaging` is an explicit workaround, not decoration - PyPortfolioOpt
# imports it without declaring it.
quant = [
    "pyportfolioopt>=1.6.0",
    "skfolio>=1.0.2",
    "pandas>=2.0",
    "packaging",
]
# A45 P2c: medical imaging. MONAI Apache-2.0, pydicom MIT, nibabel MIT.
# MONAI alone registers only Numpy/PIL readers - pydicom and nibabel are
# what let it open a DICOM or a NIfTI at all, so they are not optional here.
# Orthanc is NOT listed: it is GPLv3 and is reached over HTTP as a server
# the owner runs, never imported and never bundled.
medimg = [
    "monai>=1.6.0",
    "pydicom>=3.0",
    "nibabel>=5.3",
    "numpy>=1.24",
]
# A45 P2e: CAD measurement. CadQuery Apache-2.0 (its OCP/OCCT stack carries
# an LGPL-3.0 component). ~1.3 GB installed and ~140 s on FIRST import while
# it compiles bytecode; 1.1 s warm. OpenSCAD is NOT here: it is GPL-2.0-or-
# later and is run as a separate program (brew install --cask openscad),
# never linked.
cad = [
    "cadquery>=2.8.0",
]
# assets-embed / assets-gen are declared below but stay loosely pinned on
# purpose: torch wheels are backend- and machine-specific (CUDA build vs the
# Apple-Silicon build), so pinning an exact version here would break one of
# them. Verified working on 2026-08-22 with torch 2.13 / diffusers 0.40 /
# transformers 5.15 on an Apple M5 (MPS).
#   assets-embed: SigLIP 2 (Apache-2.0) text embeddings for asset search.
#     Never MobileCLIP - MIT repo, research-only WEIGHTS.
#   assets-gen: lane 1 local text->image (Z-Image-Turbo, Apache-2.0).
#     Lane 3 (TRELLIS.2 image->3D) additionally needs CUDA: nvdiffrast is
#     CUDA-bound, so it is unavailable on Apple Silicon.

assets-embed = [
    "torch>=2.4",
    "transformers>=4.50",
    "sentencepiece>=0.2",
]
assets-gen = [
    "torch>=2.4",
    "diffusers>=0.35",
    "transformers>=4.50",
    "accelerate>=1.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tee"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = [
    "dcc: requires a live DCC (Blender/Unreal) on this machine",
    "network: requires outbound network access (skips cleanly offline); excluded from the default hermetic suite - run with `-m network`",
    "ml: needs multi-gigabyte model weights ([assets-embed] / [assets-gen])",
    "llm: requires a live local LLM endpoint (TEE_LOCAL_LLM_URL); skips cleanly without one",
]
addopts = "-m 'not dcc and not ml and not network and not llm'"
