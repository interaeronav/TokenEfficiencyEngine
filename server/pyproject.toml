[project]
name = "tee"
version = "0.1.0"
description = "Token Efficiency Engine - MCP server + API layer between AI models and Unreal Engine / Blender"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "interaeronav" }]
dependencies = [
    "mcp[cli]>=2.0.0,<3",
]

[project.scripts]
tee = "tee.cli:main"

[project.optional-dependencies]
extract = [
    "ezdxf>=1.4.4",
    "faster-whisper>=1.2.1",
    "ifcopenshell>=0.8.5",
    "imagehash>=4.3.2",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pymap3d>=3.2.0",
    "pypdfium2>=5.13.0",
    "pyproj>=3.7.2",
    "pytesseract>=0.3.13",
    "scenedetect>=0.7.1",
    "shapely>=2.1.2",
]
assets = [
    "astral>=3.2",
    "imagehash>=4.3.2",
    "pillow>=12.3.0",
    "shapely>=2.1.2",
]
# assets-embed (optional, CPU-only): sentence-transformers with a SigLIP-2
# (Apache) or CLIP ViT-B/32 (MIT) checkpoint for index-time thumbnail
# embeddings; never MobileCLIP (research-only weights). Deliberately not
# pinned here - GPU-adjacent stacks are machine-specific (physical box).
# assets-gen (optional, GPU): torch + diffusers for lanes 1-3 local
# generation (Z-Image/SDXL-tileable/Marigold-IID, TRELLIS.2) - physical
# machine only; see docs/research/23-24.

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tee"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = [
    "dcc: requires a live DCC (Blender/Unreal) on this machine",
    "network: requires outbound network access (skips cleanly offline)",
]
addopts = "-m 'not dcc'"
