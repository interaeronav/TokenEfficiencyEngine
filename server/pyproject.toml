[project]
name = "tee"
version = "0.1.0"
description = "Token Efficiency Engine - MCP server + API layer between AI models and Unreal Engine / Blender"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "interaeronav" }]
dependencies = [
    "mcp[cli]>=2.0.0,<3",
]

[project.scripts]
tee = "tee.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tee"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = [
    "dcc: requires a live DCC (Blender/Unreal) on this machine",
]
addopts = "-m 'not dcc'"
