[project]
# distribution name (PyPI-safe); the import package and CLI stay `tee`
name = "tee-engine"
version = "0.1.0"
description = "Token Efficiency Engine - MCP server + API layer between AI models and Unreal Engine / Blender"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "interaeronav" }]
dependencies = [
    "mcp[cli]>=2.0.0,<3",
]

[project.scripts]
tee = "tee.cli:main"

[project.optional-dependencies]
extract = [
    "ezdxf>=1.4.4",
    "faster-whisper>=1.2.1",
    "ifcopenshell>=0.8.5",
    "imagehash>=4.3.2",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pymap3d>=3.2.0",
    "pypdfium2>=5.13.0",
    "pyproj>=3.7.2",
    "pytesseract>=0.3.13",
    "scenedetect>=0.7.1",
    "shapely>=2.1.2",
]
assets = [
    "astral>=3.2",
    "imagehash>=4.3.2",
    "pillow>=12.3.0",
    "shapely>=2.1.2",
]
physical = [
    "ifctester>=0.8.5",
    "py-slvs>=1.0.6",
]
# assets-embed / assets-gen are declared below but stay loosely pinned on
# purpose: torch wheels are backend- and machine-specific (CUDA build vs the
# Apple-Silicon build), so pinning an exact version here would break one of
# them. Verified working on 2026-08-22 with torch 2.13 / diffusers 0.40 /
# transformers 5.15 on an Apple M5 (MPS).
#   assets-embed: SigLIP 2 (Apache-2.0) text embeddings for asset search.
#     Never MobileCLIP - MIT repo, research-only WEIGHTS.
#   assets-gen: lane 1 local text->image (Z-Image-Turbo, Apache-2.0).
#     Lane 3 (TRELLIS.2 image->3D) additionally needs CUDA: nvdiffrast is
#     CUDA-bound, so it is unavailable on Apple Silicon.

assets-embed = [
    "torch>=2.4",
    "transformers>=4.50",
    "sentencepiece>=0.2",
]
assets-gen = [
    "torch>=2.4",
    "diffusers>=0.35",
    "transformers>=4.50",
    "accelerate>=1.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tee"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = [
    "dcc: requires a live DCC (Blender/Unreal) on this machine",
    "network: requires outbound network access (skips cleanly offline); excluded from the default hermetic suite - run with `-m network`",
    "ml: needs multi-gigabyte model weights ([assets-embed] / [assets-gen])",
]
addopts = "-m 'not dcc and not ml and not network'"
