[project]
name = "drafting"
version = "0.1.0"
description = "A drafting-standards critic and corrector for technical drawings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "interaeronav" }]
# matplotlib (PSF-based, permissive) is needed only to COMPOSE a sheet.
# The critic and the corrector are pure stdlib, so a caller who only wants to
# check a specification pulls in nothing at all.
dependencies = []

[project.optional-dependencies]
compose = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drafting"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
